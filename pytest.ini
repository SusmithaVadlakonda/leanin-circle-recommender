[pytest]
testpaths = tests
pythonpath = .
addopts = -q -ra
markers =
    scenario: the planted scenarios from the dataset README
filterwarnings =
    # Starlette 1.9 suggests httpx2 for its test client. httpx is the chosen dependency and works;
    # see decision 5 in docs/decision-log.md.
    ignore:Using .httpx. with .starlette.testclient. is deprecated
